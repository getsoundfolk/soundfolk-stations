name: stations

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *" # the daily link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pull requests (and branches the share workflow pushed): the rules, and the links that changed.
  check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository rules
        run: python3 scripts/lint.py
      - name: Only the maintainer adds `checked_by_hand`
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAINTAINER: raphaelh
        run: |
          if git diff origin/main...HEAD -- 'stations/*.toml' | grep -qE '^\+.*checked_by_hand'; then
            if [ "$AUTHOR" != "$MAINTAINER" ]; then
              echo "::error::checked_by_hand is for the maintainer only: give found_on, a page of the station's website that links to the donation page."
              exit 1
            fi
            echo "Checked by hand, added by the maintainer."
          fi
      - name: The station's website links to the donation page
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'stations/*.toml')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No entry changed."
          else
            python3 scripts/check_links.py "${changed[@]}"
          fi
      - name: Compile the list
        run: python3 scripts/compile.py
      - name: A new list is written by its curators
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAINTAINER: raphaelh
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          author, maintainer = os.environ["AUTHOR"].lower(), os.environ["MAINTAINER"].lower()
          diff = ["git", "diff", "--name-status", "origin/main...HEAD", "--", "lists/*.toml"]
          failed = False
          for line in subprocess.run(diff, capture_output=True, text=True, check=True).stdout.splitlines():
              status, path = line.split("\t")[0], line.split("\t")[-1]
              if status.startswith("D"):
                  continue
              curators = [c.lower() for c in tomllib.load(open(path, "rb")).get("curators", [])]
              if author in curators or author == maintainer:
                  continue
              if status.startswith("A"):
                  print(f"::error file={path}::A new list names its author among `curators`.")
                  failed = True
              else:
                  print(f"::warning file={path}::{author} is not a curator of this list: the maintainer asks them.")
          raise SystemExit(1 if failed else 0)
          PY
      - name: The stations of the lists that changed
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'lists/*.toml')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No list changed."
          else
            python3 scripts/check_lists.py "${changed[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile the lists
        run: |
          python3 scripts/check_lists.py --daily /dev/null -o "$RUNNER_TEMP/lists-status.json"
          python3 scripts/compile_lists.py --status "$RUNNER_TEMP/lists-status.json" -o "$RUNNER_TEMP/lists.json"

  # main, every push and every day: check every link, publish the list without the ones that fail.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}v1/stations.json
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository rules
        run: python3 scripts/lint.py
      - name: Check every link
        run: |
          # Yesterday's status says since when each failing link fails. None on the first run.
          curl -fsS "$PAGES/v1/status.json" -o previous.json || echo '{}' > previous.json
          python3 scripts/check_links.py --daily previous.json -o site/v1/status.json --issues issues.json \
            | tee check.txt
          { echo '## Link check'; echo; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check every list
        run: |
          curl -fsS "$PAGES/v1/lists-status.json" -o previous-lists.json || echo '{}' > previous-lists.json
          python3 scripts/check_lists.py --daily previous-lists.json -o site/v1/lists-status.json \
            --issues list-issues.json | tee check-lists.txt
          { echo '## List check'; echo; echo '```'; cat check-lists.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile the list
        run: |
          python3 scripts/compile.py --status site/v1/status.json -o site/v1/stations.json
          python3 scripts/compile_lists.py --status site/v1/lists-status.json -o site/v1/lists.json
          cp station.schema.json list.schema.json site/v1/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Open issues for broken links and lists
        run: |
          gh label create broken-link --color d73a4a --description "Left out of the published list" --force
          gh label create list-review --color 0e8a16 --description "Yearly review of a list" --force
          jq -s -c 'add | .[]' issues.json list-issues.json | while read -r issue; do
            title=$(jq -r .title <<< "$issue")
            label=$(jq -r '.label // "broken-link"' <<< "$issue")
            jq -r .body <<< "$issue" > body.md
            open=$(gh issue list --label "$label" --state open --search "\"$title\" in:title" \
              --json title --jq "map(select(.title == \"$title\")) | length")
            if [ "$open" = "0" ]; then
              gh issue create --title "$title" --label "$label" --body-file body.md
            fi
          done
