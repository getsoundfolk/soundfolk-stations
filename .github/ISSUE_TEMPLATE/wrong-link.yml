name: Report a wrong link
description: A donation link leads somewhere else than the station, or doesn't work any more.
labels: [wrong-link]
body:
  - type: input
    id: station
    attributes:
      label: Station
      description: Its name, or the file in stations/.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Where the link leads, and why it isn't the station's. Stations can ask here for their entry to be changed or removed.
    validations:
      required: true
